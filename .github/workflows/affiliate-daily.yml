name: MasterStox Affiliate — פרסום אוטומטי

# תזמון אוטומטי: המנוע רץ פעמיים ביום, שולף מוצרים, מעדכן את האתר ומפרסם פוסט.
on:
  schedule:
    - cron: "0 9 * * *"    # כל יום 09:00 UTC (~11:00-12:00 בישראל)
    - cron: "0 17 * * *"   # כל יום 17:00 UTC (~19:00-20:00 בישראל)
  workflow_dispatch: {}     # אפשר גם להריץ ידנית מלשונית Actions

permissions:
  contents: write           # כדי לשמור קטלוג ואתר מעודכנים במאגר

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affiliate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת תלויות
        run: pip install -r requirements.txt

      - name: הרצת הצינור (שליפה → אתר → פרסום)
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TARGET_CURRENCY: ${{ vars.TARGET_CURRENCY || 'ILS' }}
          TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE || 'HE' }}
          SHIP_TO_COUNTRY: ${{ vars.SHIP_TO_COUNTRY || 'IL' }}
        run: python src/pipeline.py

      - name: שמירת הקטלוג והאתר המעודכנים
        run: |
          git config user.name "masterstox-bot"
          git config user.email "bot@masterstox.local"
          git add data/ site/
          if git diff --staged --quiet; then
            echo "אין שינויים לשמירה."
          else
            git commit -m "אוטומטי: עדכון קטלוג ואתר [skip ci]"
            git push
          fi
